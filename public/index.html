<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>United Flag Football League</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040a1c;--panel:#09132b;--panel2:#0e1c3d;--line:#182a52;--line2:#27407a;
  --amber:#ffd60a;--amber-d:#7a6405;--blue2:#2b8cff;--text:#ffffff;--dim:#8b929d;--dim2:#5d6470;
  --green:#5fbf9b;--red:#e5504b;--teal:#5db3b5;--violet:#b08ae0;--blue:#6ea4d8;--pink:#d98aa8;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Inter','Outfit','Segoe UI',system-ui,sans-serif;
  --mono:'Inter','Outfit','Segoe UI',system-ui,sans-serif;--code:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100%;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1000px 460px at 50% -160px,rgba(30,110,255,.38),transparent 70%);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}

/* header */
.dot{width:5px;height:5px;border-radius:50%;background:var(--red);display:inline-block}
.seasonsel{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.seasonsel select{background:var(--panel);color:var(--text);font:600 12px var(--body);border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:8px 10px}
.seasonsel select option{background:#0e1c3d;color:var(--text)}
.btn-amber{background:var(--amber);color:#10140a;font-family:var(--body);font-weight:700;font-size:10px;letter-spacing:.1em;padding:10px 14px;border-radius:6px;text-transform:uppercase;transition:filter .15s}
.btn-amber:hover{filter:brightness(1.08)}
.gs{position:relative;width:min(100%,190px)}
.gs input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--text);font:400 11px var(--body);padding:9px 10px 9px 30px}
.gs input::placeholder{color:var(--dim2)}
.gs svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:12px;height:12px;color:var(--dim2)}
.gs .drop{position:absolute;right:0;top:calc(100% + 6px);width:290px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px;z-index:30;box-shadow:0 20px 40px rgba(0,0,0,.6);display:none}
.gs .drop.open{display:block}
.drop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:4px}
.drop button:hover,.drop button:focus-visible{background:rgba(255,214,10,.08)}
.drop small{color:var(--dim);font-size:11px;display:block}
.drop .empty{padding:10px;color:var(--dim);font-size:12px}

/* shared */
main{max-width:1180px;margin:0 auto;padding:0 20px 40px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.eyebrow.amber{color:var(--amber)}
.eyebrow .sep{color:var(--dim2)}
h1.big{font-family:var(--disp);font-weight:800;font-size:clamp(52px,9vw,84px);line-height:.95;letter-spacing:.005em;margin-top:8px;text-transform:uppercase}
h1.big i{font-style:normal;color:var(--amber)}
.sub{color:var(--dim);font-size:12px;margin-top:6px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:26px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.03em;color:#fff;flex:none;border:1px solid rgba(255,255,255,.14);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.badge{position:relative;overflow:hidden}
.badge img{width:100%;height:100%;object-fit:cover;display:block}
.badge.lg{width:38px;height:38px;font-size:15px;border-radius:8px}
.badge.xl{width:74px;height:74px;font-size:30px;border-radius:12px;border-color:var(--amber-d)}
.badge.md{width:34px;height:34px;font-size:13px;border-radius:7px}
.badge.sm{width:24px;height:24px;font-size:10px;border-radius:5px}
.label{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2)}
.pos{color:var(--dim)}
footer.foot{max-width:1180px;margin:0 auto;padding:0 20px 40px}
footer .in{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase;gap:10px;flex-wrap:wrap}

/* schedule */
.cal{margin-top:8px}
.cal-head{padding:20px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.cal-head h2{font-family:var(--disp);font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin-top:6px}
.cal-head .m{text-align:right}
.cal-head .m b{font-family:var(--disp);font-size:24px;color:var(--amber);display:block;line-height:1}
.note{border-top:1px solid var(--line);padding:9px 20px;font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.note svg{width:11px;height:11px;color:var(--amber)}
.filters{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fgroup .label{margin-right:6px;color:var(--amber)}
.chip{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--line2);border-radius:2px;color:var(--dim);background:var(--panel2);transition:.15s}
.chip:hover{color:var(--text);border-color:var(--dim2)}
.chip.on{border-color:var(--amber);color:var(--amber);background:rgba(255,214,10,.1)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.gc{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px 14px 9px;text-align:left;display:block;width:100%;transition:border-color .15s,background .15s;position:relative}
.gc:hover{border-color:var(--line2)}
.gc.sel{border-color:var(--amber-d);background:linear-gradient(120deg,rgba(255,214,10,.12),rgba(255,214,10,.02) 55%)}
.gc.sel::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;background:var(--amber);border-radius:6px 0 0 6px}
.gc .r1,.gc .r3{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}
.gc .r1 .fin{color:var(--dim)}
.gc .r1 .up{color:var(--amber)}
.gc .r2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:13px 0 12px}
.gc .tn{font-weight:600;font-size:11.5px}
.gc .tn.l{text-align:right}
.gc .tn.lose{color:var(--dim)}
.gc .sc{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:700;font-size:16px}
.gc .sc .d{color:var(--dim2);font-size:11px;font-family:var(--mono)}
.gc .sc .vs{font-family:var(--mono);font-size:8px;color:var(--dim2);letter-spacing:.1em}
.gc .r3 a,.gc .r3 span.act{color:var(--dim);cursor:pointer}
.gc .r3 .act.hot{color:var(--amber)}
.gc .r3 .act:hover{color:var(--text)}
.sel-panel{margin:0 8px 8px;border:1px solid var(--amber-d);border-radius:6px;background:linear-gradient(180deg,rgba(255,214,10,.07),rgba(255,214,10,0) 60%),var(--panel2);padding:14px 16px 16px}
.sel-panel .top{display:flex;justify-content:space-between}
.sel-panel .top .label:first-child{color:var(--amber)}
.sel-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:16px 0 10px}
.sel-main .side{display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px}
.sel-main .side.r{flex-direction:row-reverse;text-align:right}
.sel-main .mid{text-align:center}
.sel-main .mid b{font-family:var(--disp);font-size:28px;color:var(--amber);font-weight:700;letter-spacing:.02em;display:block;line-height:1.1}
.sel-meta{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
.sel-meta span{display:inline-flex;align-items:center;gap:6px}
.sel-meta svg{width:12px;height:12px;color:var(--amber)}
.recap{margin-top:8px;font-size:13px;color:#cfd2d8;max-width:70ch}
.qtable{margin-top:12px;border-collapse:collapse;font-family:var(--mono);font-size:11px;min-width:260px}
.qtable th{font-weight:500;color:var(--dim2);font-size:8.5px;letter-spacing:.14em;padding:5px 12px;text-align:center}
.qtable td{padding:6px 12px;text-align:center;border-top:1px solid var(--line)}
.qtable td:first-child,.qtable th:first-child{text-align:left;padding-left:0;font-family:var(--body);font-weight:600}
.qtable td:last-child{color:var(--amber);font-weight:600}

/* players */
.rosterhead{display:flex;justify-content:space-between;align-items:flex-end;padding:26px 0 18px;flex-wrap:wrap;gap:10px}
.rosterhead h1{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1;margin-top:8px}
.rosterhead a.l{font-size:19px;color:var(--dim);letter-spacing:.02em;display:flex;align-items:center;gap:8px;text-transform:uppercase;transition:color .15s;cursor:pointer}
.rosterhead a.l:hover{color:var(--amber)}
.rsearch{position:relative;margin-bottom:14px}
.rsearch input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);font:400 17px var(--body);padding:15px 16px 15px 46px}
.rsearch input::placeholder{color:var(--dim)}
.rsearch svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pc{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#0e1c3d,#0e1116);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.pc:hover{border-color:var(--amber-d)}
.pc .who{flex:1;min-width:0}
.pc .who b{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .who span{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.pc .fp{text-align:right;align-self:flex-start;padding-top:2px}
.pc .fp b{font-family:var(--disp);font-size:18px;color:var(--amber);font-weight:600;display:block;line-height:1.1}
.pc .fp span{font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;color:var(--dim2);display:block;margin-top:14px}

/* standings */
.stamp{border:1px solid var(--amber-d);border-radius:10px;padding:14px 26px;text-align:center;background:rgba(255,214,10,.05);align-self:flex-start}
.stamp b{font-family:var(--disp);font-size:34px;color:var(--amber);font-weight:700;display:block;line-height:1;border-bottom:1px solid var(--amber-d);padding-bottom:6px;margin:6px 0}
.stamp .label{color:var(--dim)}
.stamp .ver{color:var(--green)}
.desk{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:14px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.desk .g{display:flex;gap:10px;align-items:center}
.desk .g i{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block}
.desk em{font-style:normal;color:var(--dim2);letter-spacing:.06em;text-transform:none}
.confs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.conf{border-radius:14px;overflow:hidden}
.conf .ch{display:flex;align-items:center;gap:14px;padding:16px 16px 14px;position:relative}
.conf .shield{width:38px;height:38px;border-radius:9px;border:1px solid var(--amber-d);display:grid;place-items:center;color:var(--amber);background:rgba(255,214,10,.07);flex:none}
.conf .shield.t{border-color:#2c5a52;color:var(--green);background:rgba(95,191,155,.07)}
.conf .shield svg{width:18px;height:18px}
.conf h3{font-family:var(--disp);font-size:24px;font-weight:700;text-transform:uppercase;line-height:1;margin-top:4px;letter-spacing:.01em}
.conf .ch .tag{position:absolute;right:16px;top:14px;font-family:var(--mono);font-size:8px;color:var(--amber);border:1px solid var(--amber-d);padding:4px 6px;border-radius:3px}
.conf .ch .label{color:var(--amber)}
.conf .ch small{font-size:10.5px;color:var(--dim)}
.divs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border-top:1px solid var(--line)}
.div{border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
.div .dh{display:flex;justify-content:space-between;padding:12px 12px 10px}
.div .dh b{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;display:block;padding-bottom:6px;border-bottom:2px solid var(--amber);width:max-content}
.div .dh span{font-family:var(--mono);font-size:8px;color:var(--dim2);letter-spacing:.12em}
.div .cols,.div .row{display:grid;grid-template-columns:22px 1fr 44px 44px;align-items:center;gap:4px;padding:0 12px}
.div .cols{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;color:var(--dim2);padding-top:6px;padding-bottom:6px;border-top:1px solid var(--line)}
.div .cols :nth-child(n+3){text-align:center}
.row{width:100%;text-align:left;border-top:1px solid var(--line);padding-top:8px !important;padding-bottom:8px !important;position:relative;transition:background .15s}
.row:hover{background:rgba(255,255,255,.03)}
.row.sel{background:linear-gradient(90deg,rgba(255,214,10,.14),rgba(255,214,10,.02))}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amber)}
.row .rk{font-family:var(--mono);font-size:10px;color:var(--dim2)}
.row .rk.one{color:var(--amber)}
.row .club{display:flex;align-items:center;gap:8px;min-width:0}
.row .club b{font-size:10.5px;font-weight:600;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .club small{font-family:var(--mono);font-size:8px;color:var(--dim2);letter-spacing:.04em}
.row .wl,.row .df{text-align:center}
.row .wl b{font-family:var(--disp);font-size:14px;font-weight:700;display:block;line-height:1.05}
.row .df b{font-family:var(--mono);font-size:10px;font-weight:500;display:block}
.row small.t{font-family:var(--mono);font-size:6.5px;color:var(--dim2);letter-spacing:.14em;display:block}
.pos-n{color:var(--green)}.neg-n{color:var(--red)}
.club-panel{margin-top:14px;display:grid;grid-template-columns:auto repeat(4,auto) 1fr;gap:0;align-items:center;border-color:var(--amber-d);background:linear-gradient(90deg,rgba(255,214,10,.08),var(--panel) 45%);padding:0}
.club-panel>div{padding:20px 22px}
.club-panel .idn{display:flex;gap:16px;align-items:center;padding-right:30px}
.club-panel .idn h4{font-family:var(--body);font-size:22px;font-weight:500;line-height:1.15;margin-top:6px}
.club-panel .idn small{font-size:11px;color:var(--dim)}
.club-panel .stat{border-left:1px solid var(--line)}
.club-panel .stat b{font-family:var(--body);font-size:20px;font-weight:600;display:block;margin-top:8px}
.club-panel .cm{border-left:1px solid var(--line);align-self:stretch}
.club-panel .cm p{font-size:12px;color:#c8ccd3;margin:10px 0 12px;max-width:44ch}
.form{display:flex;gap:6px}
.form i{width:20px;height:20px;border-radius:3px;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:8px;border:1px solid}
.form i.W{color:var(--green);border-color:#2c5a52;background:rgba(95,191,155,.1)}
.form i.L{color:var(--red);border-color:#6b2b29;background:rgba(229,80,75,.1)}
.hint{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;color:var(--dim);gap:10px;flex-wrap:wrap}
.hint span:first-child{display:flex;gap:8px;align-items:center}
.hint svg{width:12px;height:12px;color:var(--amber)}

/* stats */
.chipbar{display:flex;align-items:center;gap:14px;padding:6px 0;flex-wrap:wrap}
.pillstat{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px 18px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--green);display:flex;align-items:center;gap:10px;align-self:flex-end}
.pillstat i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.pillstat span{color:var(--dim2)}
.srow{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.srow>.label{width:70px}
.sbtn{font-family:var(--mono);font-size:11px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:3px;color:var(--dim);min-width:48px;transition:.15s}
.sbtn:hover{color:var(--text);border-color:var(--line2)}
.sbtn.on{border-color:var(--amber);color:var(--amber);background:rgba(255,214,10,.1)}
.pbtn{text-align:left;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:3px;min-width:90px;transition:.15s}
.pbtn b{font-family:var(--disp);font-size:20px;font-weight:700;display:block;line-height:1;color:var(--text)}
.pbtn small{font-size:9px;color:var(--dim)}
.pbtn:hover{border-color:var(--line2)}
.pbtn.on{border-color:var(--amber);background:rgba(255,214,10,.1)}
.pbtn.on b{color:var(--amber)}
.toolbar{margin-top:20px;display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.toolbar .showing{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);flex:1;min-width:200px;text-transform:uppercase}
.toolbar .showing svg{width:14px;height:14px;color:var(--amber)}
.toolbar .showing b{color:var(--text);font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none;font-weight:600}
.toolbar .showing em{font-style:normal;color:var(--dim2);letter-spacing:.02em;text-transform:none;font-family:var(--body);font-size:11px}
.toolbar .f{position:relative}
.toolbar .f input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text);font:400 15px var(--body);padding:10px 12px 10px 38px;width:220px}
.toolbar .f input::placeholder{color:var(--dim)}
.toolbar .f svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--dim)}
.toolbar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;font:600 11px var(--body);padding:11px 12px;cursor:pointer}
.tablewrap{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow-x:auto}
table.st{width:100%;border-collapse:collapse;min-width:760px}
table.st th{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim2);font-weight:500;text-align:right;padding:18px 14px;background:rgba(255,255,255,.02);white-space:nowrap}
table.st th button{font:inherit;letter-spacing:inherit;color:inherit;text-transform:uppercase;padding:0}
table.st th button:hover{color:var(--text)}
table.st th.on{color:var(--amber)}
table.st th:first-child,table.st th:nth-child(2){text-align:left}
table.st td{padding:14px;text-align:right;font-family:var(--mono);font-size:11px;border-top:1px solid var(--line)}
table.st td:first-child{font-size:10px;color:var(--dim2);width:70px}
table.st td:first-child.one{color:var(--amber)}
table.st td.pl{text-align:left}
table.st tr.r{cursor:pointer;transition:background .15s}
table.st tr.r:hover{background:rgba(255,255,255,.035)}
.pcell{display:flex;align-items:center;gap:12px}
.pcell b{font-family:var(--body);font-weight:600;font-size:11.5px;display:block}
.pcell small{font-family:var(--body);font-size:9.5px;color:var(--dim)}
td.hl{color:var(--amber);font-weight:600}
td.gn{color:var(--green);font-weight:600}
.tfoot{display:flex;justify-content:space-between;margin-top:12px;font-size:10.5px;color:var(--dim2);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;gap:10px;flex-wrap:wrap}
.tfoot span:first-child{text-transform:none;font-family:var(--body);letter-spacing:0}

/* home */
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:20px;margin-top:20px}
.streak{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(229,80,75,.07);border:1px solid #4d1f20;border-radius:4px;font-size:10.5px;color:#d5cfcf}
.streak b.k{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--red)}
.streak .w{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--red)}
.streak svg{width:13px;height:13px;color:var(--red)}
.potw{margin-top:12px;border:1px solid var(--amber-d);border-radius:8px;padding:18px 18px 14px;background:linear-gradient(135deg,rgba(255,214,10,.08),transparent 55%),var(--panel);position:relative;
  background-image:linear-gradient(135deg,rgba(255,214,10,.08),transparent 55%),linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:auto,26px 26px,26px 26px}
.pill{background:var(--amber);color:#16110a;font-family:var(--mono);font-weight:600;font-size:9px;letter-spacing:.12em;padding:6px 8px;border-radius:2px;text-transform:uppercase}
.potw .crown{position:absolute;right:18px;top:16px;color:var(--amber);width:24px;height:24px}
.potw .id{display:flex;gap:18px;align-items:center;margin:12px 0 18px}
.potw .id h2{font-family:var(--disp);font-size:36px;font-weight:700;line-height:1;text-transform:none}
.potw .id p{color:var(--dim);font-size:13px;margin-top:6px}
.potw .id .badge.xl{width:82px;height:82px;font-size:30px}
.potw .nums{display:flex;gap:30px;border-top:1px solid var(--line2);padding-top:14px;align-items:flex-end}
.potw .nums b{font-family:var(--disp);font-size:24px;font-weight:600;display:block;line-height:1}
.potw .nums b.a{color:var(--amber)}
.potw .nums .label{display:block;margin-top:6px;font-size:8px}
.potw .vp{margin-left:auto;font-size:10px;color:var(--dim);display:flex;gap:6px;align-items:center;transition:color .15s}
.potw .vp:hover{color:var(--amber)}
.sect{margin-top:30px}
.sect h2{font-family:var(--disp);font-size:24px;font-weight:700;text-transform:uppercase;margin-top:6px;letter-spacing:.01em}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ac{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px 0;text-align:left;overflow:hidden;transition:border-color .15s}
.ac:hover{border-color:var(--line2)}
.ac .h{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:600;color:#d5d7db;margin-bottom:8px}
.ac .h svg{width:11px;height:11px;flex:none}
.ac .h em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:7px;letter-spacing:.1em;border:1px solid var(--line2);padding:3px 5px;border-radius:2px;color:var(--dim)}
.ac .b{display:flex;align-items:center;gap:8px;padding-bottom:10px}
.ac .b .n{font-family:var(--mono);font-size:7.5px;color:var(--dim2)}
.ac .b .w{flex:1;min-width:0}
.ac .b .w b{font-size:9.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .b .w small{font-size:8px;color:var(--dim)}
.ac .b .v{text-align:right}
.ac .b .v b{font-family:var(--disp);font-size:14px;font-weight:600;display:block;line-height:1.1}
.ac .b .v small{font-family:var(--mono);font-size:6.5px;color:var(--dim2);letter-spacing:.06em}
.ac .bar{height:2px;margin:0 -12px}
.ac .bar i{display:block;height:100%}
.results{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.res{display:grid;grid-template-columns:110px 1fr 90px 1fr;align-items:center;padding:20px 22px;border-top:1px solid var(--line);gap:8px}
.res:first-child{border-top:0}
.res .dt{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.02em}
.res .t{display:flex;align-items:center;gap:12px;font-weight:600;font-size:12px}
.res .t.l{justify-content:flex-end}
.res .t.lose{color:var(--dim)}
.res .s{text-align:center;font-family:var(--disp);font-weight:700;font-size:16px}
.res .s small{display:block;font-family:var(--mono);font-size:7.5px;color:var(--dim2);letter-spacing:.14em;font-weight:400}
.lb{position:sticky;top:76px;align-self:start;border-radius:6px;background:var(--panel2);overflow:hidden}
.lb .h{padding:14px 14px 10px}
.lb .h .row1{display:flex;justify-content:space-between;align-items:center}
.lb .h h3{font-family:var(--disp);font-size:20px;font-weight:700;text-transform:uppercase;margin-top:8px;letter-spacing:.02em}
.lb .live{font-family:var(--mono);font-size:7px;letter-spacing:.12em;color:var(--green);display:flex;align-items:center;gap:6px;text-transform:none}
.lb .live i{width:5px;height:5px;background:var(--green);border-radius:50%}
.lb .tabs{display:flex;gap:16px;padding:0 14px;border-bottom:1px solid var(--line)}
.lb .tabs button{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--dim2);padding:8px 0;text-transform:uppercase;border-bottom:1px solid transparent;margin-bottom:-1px}
.lb .tabs button.on{color:var(--amber);border-color:var(--amber)}
.lbr{display:flex;align-items:center;gap:9px;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left;transition:background .15s}
.lb .tabs+.lbr{border-top:0}
.lbr:hover{background:rgba(255,255,255,.03)}
.lbr .n{font-family:var(--mono);font-size:9px;color:var(--dim2);width:16px}
.lbr:first-of-type .n{color:var(--amber)}
.lbr .w{flex:1;min-width:0}
.lbr .w b{font-size:10.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbr .w small{font-family:var(--mono);font-size:7px;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase}
.lbr .k{font-family:var(--mono);font-size:8px;color:var(--dim)}
.lbr .k.W{color:var(--green)}.lbr .k.L{color:var(--red)}
.lbr .v{font-family:var(--disp);font-size:14px;color:var(--amber);font-weight:600;min-width:34px;text-align:right}
.lb .all{display:block;width:100%;text-align:center;border-top:1px solid var(--line);padding:14px;font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;color:var(--dim);transition:color .15s}
.lb .all:hover{color:var(--amber)}

/* live */
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sim{padding:18px}
.sim .st{display:flex;justify-content:space-between;align-items:center}
.sim .pillr{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;padding:5px 8px;border-radius:2px;border:1px solid var(--line2);color:var(--dim)}
.sim .pillr.on{color:var(--red);border-color:#6b2b29;background:rgba(229,80,75,.08)}
.sim .pillr.on::before{content:"";display:inline-block;width:5px;height:5px;background:var(--red);border-radius:50%;margin-right:6px;animation:blink 1.1s infinite}
.sim .pillr.done{color:var(--green);border-color:#2c5a52}
@keyframes blink{50%{opacity:.2}}
.sim .board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:18px 0 12px}
.sim .tm{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:12px;text-align:center}
.sim .big{font-family:var(--disp);font-size:44px;font-weight:700;line-height:1}
.sim .big.lead{color:var(--amber)}
.sim .clock{text-align:center;font-family:var(--mono)}
.sim .clock b{font-size:16px;display:block}
.sim .clock small{font-size:8.5px;color:var(--dim2);letter-spacing:.14em}
.sim .ctl{display:flex;gap:8px;margin:10px 0 12px}
.sim .ctl button{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;border-radius:3px;border:1px solid var(--line2);color:var(--dim)}
.sim .ctl button:hover{color:var(--text)}
.sim .ctl button.p{background:var(--amber);border-color:var(--amber);color:#16110a;font-weight:600}
.feed{list-style:none;border-top:1px solid var(--line);max-height:190px;overflow-y:auto;font-size:12px}
.feed li{padding:8px 0;border-bottom:1px solid var(--line);color:var(--dim);display:flex;gap:10px}
.feed li b{font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--dim2);flex:none;width:44px;padding-top:2px}
.feed li.sc{color:var(--text)}
.feed li.sc b{color:var(--amber)}
.feed li.empty{color:var(--dim2)}

/* rulebook */
.rules{display:grid;gap:8px;max-width:820px}
.rules details{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.rules summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px;font-family:var(--disp);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.rules summary::-webkit-details-marker{display:none}
.rules summary .label{color:var(--amber);width:26px}
.rules summary::after{content:"+";margin-left:auto;font-family:var(--mono);color:var(--dim);font-size:16px}
.rules details[open] summary::after{content:"–"}
.rules details[open]{border-color:var(--amber-d)}
.rules .body{padding:0 18px 18px 58px;color:#c5c9d0;font-size:14px;max-width:70ch}
.rules ul{padding-left:18px;display:grid;gap:6px}

/* dialog */
dialog{max-height:88vh;overflow:auto;margin:auto;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:0;width:min(700px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(3px)}
.dlg{padding:22px}
.dlg .x{position:absolute;right:14px;top:14px;color:var(--dim);font-size:20px;line-height:1;padding:6px 10px}
.dlg .x:hover{color:var(--text)}
.dlg h3{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1}
.dlg .idn{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.dlg .idn p{color:var(--dim);font-size:13px;margin-top:6px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sgrid div{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 12px}
.sgrid b{font-family:var(--disp);font-size:22px;font-weight:600;display:block;line-height:1.1}
.sgrid b.a{color:var(--amber)}
.sgrid .label{font-size:7.5px}
.dlg label{display:block;margin-top:14px}
.dlg input,.dlg select{width:100%;margin-top:6px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;color:var(--text);font:400 14px var(--body);padding:11px 12px}
.dlg .submit{margin-top:18px;width:100%;padding:13px;font-size:10px}
.dlg .ok{padding:14px;border:1px solid #2c5a52;background:rgba(95,191,155,.08);border-radius:8px;color:var(--green);margin-top:16px;font-size:13px}

/* team logo beside player names, medals, All Flag teams, themed profile */
.badge.xs{width:18px;height:18px;font-size:8px;border-radius:4px}
.pn{display:flex;align-items:center;gap:7px;min-width:0}
.pn .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pn .badge{flex:none}
.medal{width:22px;height:22px;flex:none;display:block}
.medal.lg{width:34px;height:34px}
.aftabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.aftab{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);transition:.15s}
.aftab:hover{color:var(--text)}
.aftab.on{border-color:var(--tc);color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 16%,transparent),transparent)}
.afgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.afp{border:1px solid var(--line);border-top:2px solid var(--tc);border-radius:8px;background:var(--panel);overflow:hidden}
.afp .afh{display:flex;align-items:center;gap:12px;padding:14px 16px}
.afp .afh b{font-family:var(--disp);font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;display:block;margin-top:3px}
.afr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 16px;border-top:1px solid var(--line);transition:background .15s}
button.afr:hover{background:rgba(255,255,255,.035)}
.afr .slot{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--tc);width:26px;flex:none}
.afr .w{flex:1;min-width:0}
.afr .w b{font-size:12.5px;font-weight:600;display:block}
.afr .w small{font-size:10.5px;color:var(--dim)}
.afr .fp{font-family:var(--disp);font-size:16px;font-weight:600;color:var(--tc)}
.afr.none .w small{color:var(--dim2)}
.bk{display:flex;gap:18px;overflow-x:auto;padding:4px 0 18px}.bk-col{min-width:250px;flex:1;display:flex;flex-direction:column;gap:12px}
.bk-col h3{font-family:var(--disp);font-size:20px;text-transform:uppercase;margin:0}.bk-list{display:flex;flex-direction:column;justify-content:space-around;gap:12px;flex:1}
.bk-g{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}.bk-t{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px}.bk-t+.bk-t{border-top:1px solid var(--line)}
.bk-t b{margin-left:auto;font-family:var(--mono)}.bk-t.w{background:rgba(255,214,10,.12);font-weight:600}.bk-t.l{opacity:.5}.bk-t.tbd{color:var(--dim)}
.bk-champ{display:flex;align-items:center;gap:12px;padding:14px 18px;margin-bottom:18px;border:1px solid var(--amber);border-radius:8px;background:rgba(255,214,10,.08)}
.honors{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.honor{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18);font-size:11px;font-weight:500}
.dlg.tc h3{color:#fff}
.dlg.tc .x,.dlg.tc .idn p,.dlg.tc .sub{color:rgba(255,255,255,.82)}
.dlg.tc .label{color:rgba(255,255,255,.7)}
.dlg.tc .sgrid div{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.16)}
.dlg.tc .sgrid b.a{color:#fff}
.dlg.tc .badge.xl{border-color:rgba(255,255,255,.45)}
@media(max-width:700px){.afgrid{grid-template-columns:1fr}}
.avlist{display:grid;gap:6px;max-height:55vh;overflow-y:auto;margin-top:14px}
.avrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px}
.avrow b{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.avrow label{cursor:pointer}
@media (max-width:1000px){
  .hgrid{grid-template-columns:1fr}
  .lb{position:static}
  .confs{grid-template-columns:1fr}
  .pgrid{grid-template-columns:1fr 1fr}
  .club-panel{grid-template-columns:1fr 1fr}
  .club-panel .idn{grid-column:1/-1;border-bottom:1px solid var(--line)}
  .club-panel .stat{border-left:0}
  .club-panel .cm{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .simgrid{grid-template-columns:1fr}
  .seasonsel span{display:none}
}
@media (max-width:700px){
  .logo small{display:none}
  .btn-amber{display:none}
  .games{grid-template-columns:1fr}
  .pgrid{grid-template-columns:1fr}
  .agrid{grid-template-columns:1fr}
  .divs{grid-template-columns:1fr}
  .res{grid-template-columns:1fr auto 1fr;padding:14px}
  .res .dt{grid-column:1/-1}
  .sel-main{grid-template-columns:1fr;text-align:center}
  .sel-main .side,.sel-main .side.r{justify-content:center;flex-direction:row}
  .sgrid{grid-template-columns:repeat(2,1fr)}
  main,footer.foot,.searchrow{padding-left:14px;padding-right:14px}
  .rules .body{padding-left:18px}
  .toolbar .f input{width:100%}
  .toolbar .f{flex:1}
}

/* ===== UFF stats look: brand header, dashboard, floating dock ===== */
main{max-width:1060px;padding:0 20px 130px}
footer.foot{max-width:1060px;padding-bottom:110px}
.brand{max-width:1060px;margin:0 auto;padding:36px 20px 0}
.logo{display:flex;align-items:center;gap:16px;width:max-content;max-width:100%}
.logo .lg{width:68px;height:68px;border-radius:50%;background:#081227;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.logo .lg img{width:58px;height:58px;object-fit:contain;display:block}
.logo b{display:block;font-family:var(--disp);font-weight:800;font-size:clamp(34px,6.4vw,52px);line-height:.88;letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap}
.logo small{display:block;font-family:var(--disp);font-weight:800;font-size:clamp(15px,2.6vw,20px);letter-spacing:.2em;color:var(--amber);margin-top:6px;line-height:1}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px;flex-wrap:wrap}
.gs{width:min(100%,358px)}
.gs input{background:var(--panel);border:1px solid var(--line2);border-radius:4px;font:500 12px var(--body);padding:10px 12px 10px 34px}
.gs svg{left:12px}
.gs .drop{left:0;right:auto;width:min(100%,360px)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-height:80px;min-width:0}
.tile .k{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tile b{display:block;font-family:var(--disp);font-weight:800;font-size:28px;line-height:1.1;margin-top:6px;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.lime b{color:var(--amber)}
.tile small{display:block;font-size:10px;color:var(--dim2);margin-top:2px}
.dgrid{display:grid;gap:20px;margin-top:20px}
.dgrid.c3{grid-template-columns:repeat(3,1fr);margin-top:44px;align-items:start}.dgrid.c2{align-items:start}
.dgrid.c2{grid-template-columns:330px 1fr}
.dp{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.dp-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 20px 18px;border-bottom:1px solid var(--line)}
.dp-h h3{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.01em;text-transform:uppercase;line-height:1;white-space:nowrap}
.dp-h h3 svg{width:17px;height:17px;color:var(--amber);flex:none}
.dp-h a{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--blue2);cursor:pointer;white-space:nowrap}
.dp-b{padding:8px 10px 12px}
.dp-empty{padding:16px 10px;font-size:12px;color:var(--dim2)}
.dp-row{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:8px;text-align:left}
button.dp-row:hover{background:var(--panel2)}
.dp-row .rk{width:16px;font-size:11px;font-weight:700;color:var(--dim2);text-align:center;flex:none}
.dp-row .w{flex:1;min-width:0}.dp-row .w b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-row .w small{display:block;font-size:10.5px;color:var(--dim2);margin-top:1px}
.dp-row .v{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--amber);flex:none}
.dp-row .v.dim{color:var(--text);font-size:16px}
.dp-row .aw{width:8px;height:8px;border-radius:50%;flex:none}
.cl{display:flex;flex-direction:column;gap:12px;padding:12px 12px 14px}

.qa a.adm{border-style:dashed;background:transparent}.qa a.adm svg{color:var(--dim)}
.rg{padding:8px 10px 12px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(14,16,21,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.65)}

.dock a svg,.dock .mb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

#splash{position:fixed;inset:0;z-index:99999;background:radial-gradient(700px 420px at 50% 35%,rgba(30,110,255,.22),transparent 70%),#04060b;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}

#splash h2{font:800 18px var(--disp);letter-spacing:.14em;color:var(--amber);text-align:center;margin:8px 0 26px;animation:spUp .7s .2s both}
#splash .pg{width:min(192px,60vw)}
#splash .bar{height:4px;border-radius:4px;background:#161b24;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--blue2),var(--amber));transition:width .35s ease-out}
#splash .pr{display:flex;justify-content:space-between;margin-top:8px;font:700 9px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#6b7280}

@keyframes spRing{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes spIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash *{animation:none!important}}

function statsFor(p,season,pos){
  if(p.custom)return customStats(p,pos,season);
  let f=1;
  if(season!==6){f=0.55+rng(hash(p.name)+season*97)()*0.65}
  const s={fp:+(p.fp*f).toFixed(1)};
  for(const k in p.raw){s[k]=k==='gp'?Math.min(40,Math.round(p.raw[k]*Math.max(.6,f))):Math.round(p.raw[k]*f)}
  if(s.att&&s.comp!==undefined)s.pct=s.comp/s.att*100;
  if(p.pos==='RB')s.ypc=s.yds/s.att;
  if(s.rec!==undefined&&s.yds!==undefined&&(p.pos==='WR'||p.pos==='TE')){s.ypr=s.yds/s.rec;s.cp=s.rec/s.tgt*100}
  return s;
}

/* Every position has its own fantasy score. An award adds up the fantasy of the positions in its scope:
   MVP = all positions, OPOY = QB+RB+WR+TE, DPOY = DB+LB (DE slot), position awards = that position only.
   The leaderboard and MVP are the only places all fantasy points are summed. Scopes, names and winners are editable in Admin > Awards. */
const AWARD_DEFS=[
 {id:'mvp',name:'Most Valuable Player',code:'MVP',color:'#f2b632',scope:['QB','RB','WR','TE','DB','LB']},
 {id:'opoy',name:'Offensive Player of the Year',code:'OPOY',color:'#5db3b5',scope:['QB','RB','WR','TE']},
 {id:'dpoy',name:'Defensive Player of the Year',code:'DPOY',color:'#b08ae0',scope:['DB','LB']},

 {id:'wr',name:'Wide Receiver of the Year',code:'WR',color:'#6ea4d8',scope:['WR']},

 {id:'db',name:'Defensive Back of the Year',code:'DB',color:'#6ea4d8',scope:['DB']},
 {id:'lb',name:'Linebacker of the Year',code:'LB',color:'#e0a33a',scope:['LB']}
];
const posFp=(p,season,r)=>p.custom?rbxFp.role(p,season,r):(p.pos===r?n0(statsFor(p,season).fp):0);
const scopeFp=(p,season,rs)=>+rs.reduce((a,r)=>a+posFp(p,season,r),0).toFixed(1);
function computeAwards(season){
  season=season||S.season;
  const defs=window.rbxAwardDefs?rbxAwardDefs():AWARD_DEFS,one=!window.rbxOne||rbxOne(),won=new Set();
  return defs.map(d0=>{
    const d=Object.assign({icon:d0.id==='mvp'?'crown':'medal'},d0),sc=d.scope||[];
    const pool=PLAYERS.map(p=>({p,rk:scopeFp(p,season,sc)})).filter(x=>x.rk>0).sort((a,b)=>b.rk-a.rk);
    let list=one?pool.filter(x=>!won.has(x.p.name)):pool;if(!list.length)list=pool;
    let top=list[0];const man=window.rbxAwardWin?rbxAwardWin(season,d.id):'';
    if(man&&PBY[man])top={p:PBY[man],rk:scopeFp(PBY[man],season,sc)};else if(!(window.rbxAwardAuto&&rbxAwardAuto()))top=null;
    if(!top)return {d,empty:true};
    won.add(top.p.name);
    const r=(list.find(x=>x.p!==top.p)||{rk:0}).rk;
    return {d,p:top.p,val:fmtV(top.rk),unit:'fantasy pts',bar:r>0?Math.min(1,top.rk/(top.rk+r)):1};
  });
}

/* ---------- All Flag teams: 1st (gold) / 2nd (silver) / 3rd (bronze) ----------
   Offense: QB, RB, TE, 5 WR.  Defense: 5 DB, LB, DE.  LB and DE both come from the LB/DE stat slot
   (DE ranked by sacks, LB by tackles). Every spot can be picked by hand in Admin > All Flag teams;
   spots left on Auto are filled with the best remaining player by fantasy points. */
const AF_TIERS=[{n:1,short:'1st',col:'#f2c14e'},{n:2,short:'2nd',col:'#cfd5de'},{n:3,short:'3rd',col:'#cd8a4f'}];
const AF_OFF=[{id:'QB',label:'QB',role:'QB',grp:'QB',kind:'fp'},{id:'RB',label:'RB',role:'RB',grp:'RB',kind:'fp'},{id:'TE',label:'TE',role:'TE',grp:'TE',kind:'fp'}]
  .concat([1,2,3,4,5].map(i=>({id:'WR'+i,label:'WR',role:'WR',grp:'WR',kind:'fp'})));
const AF_DEF=[1,2,3,4,5].map(i=>({id:'DB'+i,label:'DB',role:'DB',grp:'DB',kind:'fp'}))
  .concat([{id:'LB',label:'LB',role:'LB',grp:'LBDE',kind:'tkl'},{id:'DE',label:'DE',role:'LB',grp:'LBDE',kind:'sack'}]);
function afRank(season,sl){
  return PLAYERS.map(p=>{const fp=posFp(p,season,sl.role);if(fp<=0)return null;const st=sl.kind==='fp'?null:statsFor(p,season,sl.role);
    return {p,fp,m:(sl.kind==='sack'?n0(st.sack):sl.kind==='tkl'?n0(st.tkl):0)*1e4+fp}}).filter(Boolean).sort((a,b)=>b.m-a.m||a.p.name.localeCompare(b.p.name));
}
function computeAllFlag(season,opts){
  season=season||S.season;opts=opts||{};
  const pick=opts.pick||(window.rbxAFPick?rbxAFPick:()=>''),auto=opts.auto!==undefined?opts.auto:(!window.rbxAFAuto||rbxAFAuto());
  const slots=[...AF_OFF,...AF_DEF],rank={},used={},key=s=>s.role+'|'+s.kind;
  slots.forEach(s=>{if(!rank[key(s)])rank[key(s)]=afRank(season,s)});
  const res=AF_TIERS.map(()=>({}));
  AF_TIERS.forEach((T,ti)=>slots.forEach(s=>{const m=pick(season,T.n,s.id);if(m&&PBY[m]){res[ti][s.id]={p:PBY[m],manual:true};(used[s.grp]=used[s.grp]||new Set()).add(m)}}));
  if(auto){const order=slots.slice().sort((a,b)=>(a.id==='LB'?1:0)-(b.id==='LB'?1:0));
    AF_TIERS.forEach((T,ti)=>order.forEach(s=>{if(res[ti][s.id])return;const u=used[s.grp]=used[s.grp]||new Set(),hit=rank[key(s)].find(x=>!u.has(x.p.name));
      if(hit){res[ti][s.id]={p:hit.p,manual:false};u.add(hit.p.name)}}))}
  const row=(ti,s)=>{const x=res[ti][s.id];return {s,p:x?x.p:null,manual:!!(x&&x.manual),fp:x?posFp(x.p,season,s.role):0}};
  return AF_TIERS.map((T,ti)=>({t:T,off:AF_OFF.map(s=>row(ti,s)),def:AF_DEF.map(s=>row(ti,s))}));
}

function teamStats(name){

  PLAYERS.filter(p=>p.team===name).forEach(p=>{

    rolesOf(p).forEach(r=>{const s=statsFor(p,S.season,r);
      if(r==='QB'){T.py+=n0(s.yds);T.ptd+=n0(s.td)}

}

function fmtClock(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function makeSim(idx,g){
  const s={g,sc:[0,0],q:1,clock:720,feed:[],timer:null,done:false,started:false,el:$('#sim-'+idx)};
  const code=[TEAMS[g.a].code,TEAMS[g.b].code];
  const team=i=>g[i?'b':'a'];
  const short=n=>n.split(' ').slice(-1)[0];
  const say=(t,score)=>s.feed.unshift({t:`Q${s.q} ${fmtClock(Math.max(0,s.clock))}`,text:t,score});
  const plays=['Screen pass gains 6 yards, flag pulled at the 32.','Incomplete deep shot, defender gets a hand in.','Quick slant for 9 yards and a fresh set of downs.','Sack drops the offense back 5 yards.','Rush up the middle for 4 yards.','Flag guard gets tested on the sweep, gain of 7.'];
  function render(){
    const lead=s.sc[0]===s.sc[1]?-1:s.sc[0]>s.sc[1]?0:1;
    s.el.innerHTML=`<div class="st"><span class="label">${esc(g.venue)}</span><span class="pillr ${s.done?'done':s.timer?'on':''}">${s.done?'FINAL':s.timer?'LIVE':s.started?'PAUSED':'READY'}</span></div>
    <div class="board"><div class="tm">${badge(TEAMS[g.a].ab,g.a,'lg')}${esc(g.a)}<span class="big ${lead===0?'lead':''}">${s.sc[0]}</span></div>
      <div class="clock"><b>${s.done?'FINAL':fmtClock(s.clock)}</b><small>${s.done?'':'QUARTER '+s.q}</small></div>
      <div class="tm">${badge(TEAMS[g.b].ab,g.b,'lg')}${esc(g.b)}<span class="big ${lead===1?'lead':''}">${s.sc[1]}</span></div></div>
    <div class="ctl">${s.done?'':`<button class="p" data-simtoggle="${idx}">${s.timer?'Pause':s.started?'Resume':'Start broadcast'}</button>`}<button data-simreset="${idx}">Reset</button></div>
    <ul class="feed" aria-live="polite">${s.feed.length?s.feed.map(f=>`<li class="${f.score?'sc':''}"><b>${f.t}</b><span>${esc(f.text)}</span></li>`).join(''):'<li class="empty">Nothing yet. Start the broadcast to see plays.</li>'}</ul>`;
  }
  function tick(){
    s.clock-=15+Math.floor(Math.random()*30);
    if(Math.random()<.4){
      const side=Math.random()<.5?0:1,r=Math.random();
      if(r<.6){const pat=Math.random()<.4?2:1;s.sc[side]+=6+pat;say(`TOUCHDOWN ${short(team(side))}! ${pat}-point conversion is good.`,true)}
      else if(r<.78){s.sc[side]+=6;say(`Pick-six! ${short(team(side))} take it back to the house.`,true)}
      else if(r<.9){s.sc[side]+=2;say(`Safety. ${short(team(side))} get two.`,true)}
      else say(`${short(team(side))} stop the drive on fourth down.`)
    }else say(plays[Math.floor(Math.random()*plays.length)]);
    if(s.clock<=0){
      if(s.q>=4){
        if(s.sc[0]===s.sc[1]){const side=Math.random()<.5?0:1;s.sc[side]+=6;say(`Overtime touchdown for ${short(team(side))}.`,true)}
        s.done=true;clearInterval(s.timer);s.timer=null;say(`Final: ${g.a} ${s.sc[0]}, ${g.b} ${s.sc[1]}.`,true);
      }else{say(`End of Q${s.q}.`);s.q++;s.clock=720}
    }
    render();
  }
  s.toggle=()=>{if(s.timer){clearInterval(s.timer);s.timer=null}else{s.started=true;s.timer=setInterval(tick,900)}render()};
  s.reset=()=>{clearInterval(s.timer);Object.assign(s,{sc:[0,0],q:1,clock:720,feed:[],timer:null,done:false,started:false});render()};
  s.stop=()=>{clearInterval(s.timer);s.timer=null};
  render();
  return s;
}

  }
  if(el=c('[data-go]')){location.hash=el.dataset.go;return}
  if(el=c('[data-game]')){const i=+el.dataset.game;S.sel=i;route();const g=getGames(S.series,S.week)[i];if(g&&g.final)boxDlg(i);else window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});return}
  if(el=c('[data-series]')){S.series=+el.dataset.series;S.sel=0;route();return}
  if(el=c('[data-week]')){S.week=+el.dataset.week;S.sel=0;route();return}
  if(el=c('[data-season-btn]')){S.season=+el.dataset.seasonBtn;changeSeason();return}
  if(el=c('[data-pos]')){S.pos=el.dataset.pos;S.sortKey='fp';S.sortDir=-1;route();return}
  if(el=c('[data-sort]')){const k=el.dataset.sort;if(S.sortKey===k)S.sortDir*=-1;else{S.sortKey=k;S.sortDir=-1}$('#sortsel').value=k;renderStatTable();return}
  if(el=c('[data-tab]')){S.tab=el.dataset.tab;route();return}
  if(el=c('[data-simtoggle]')){sims[+el.dataset.simtoggle].toggle();return}
  if(el=c('[data-simreset]')){sims[+el.dataset.simreset].reset();return}
  if(el=c('[data-avclear]')){delete AV[el.dataset.avclear];saveAV();avatarDlg();route();return}
  if(c('#joinbtn')){const w=window.open(DISCORD,'_blank');if(w)w.opener=null;else location.href=DISCORD;return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    const el=e.target.closest?.('[role="button"],[role="link"],tr.r');
    if(el&&!e.target.matches('input,select,button')){e.preventDefault();el.click()}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='teamq'){S.teamq=e.target.value;$('#tgrid').innerHTML=teamGrid()}
  if(e.target.id==='rosterq'){S.rosterq=e.target.value;$('#pgrid').innerHTML=playerGrid()}
  if(e.target.id==='statfilter'){S.filter=e.target.value;renderStatTable()}
});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.avfile&&e.target.files[0]){loadAvatar(e.target.dataset.avfile,e.target.files[0]);return}
  if(e.target.id==='sortsel'){S.sortKey=e.target.value;S.sortDir=-1;renderStatTable()}
});
(window.rbxBoot?rbxBoot():route());
</script>
<script src="pages.js?v=1"></script>
<script src="legacy.js?v=1"></script>
</body>
